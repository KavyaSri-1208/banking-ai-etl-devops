services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: banking-api
    env_file: .env
    environment:
      DATA_DIR: /app/data
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: banking-frontend
    env_file: .env
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: unless-stopped

  # Run on demand: docker compose run --rm etl
  etl:
    build:
      context: .
      dockerfile: docker/Dockerfile.etl
    container_name: banking-etl
    env_file: .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    profiles: ["jobs"]
