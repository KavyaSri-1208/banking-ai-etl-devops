services:
  api:
    image: kavyasri1208/ai:api
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  frontend:
    image: kavyasri1208/ai:frontend
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  etl:
    image: kavyasri1208/ai:etl
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    deploy:
      replicas: 0
      restart_policy:
        condition: none
