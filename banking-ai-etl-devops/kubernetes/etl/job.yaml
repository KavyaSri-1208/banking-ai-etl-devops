apiVersion: batch/v1
kind: Job
metadata:
  name: banking-etl
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: etl
          image: ETL_IMAGE_PLACEHOLDER
          env:
            - name: DATA_DIR
              value: /app/data
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
